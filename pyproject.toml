[project]
name = "fly-in"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "psilva-p", email = "psilva-p@student.42lisboa.com" }
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.5",
]

[project.scripts]
fly-in = "fly_in.cli:main"

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths = ["src/tests"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
]
